name: CI

on:
  push:
    branches: [main, develop]
  # Todos los PRs (a cualquier rama destino) pasan por el gate de tipos/lint/tests.
  # Antes solo se validaban los PRs a main, dejando ramas de integracion sin red.
  pull_request:

env:
  NODE_VERSION: '22'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/park_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/park_test
  REDIS_URL: redis://localhost:6379
  # Debe tener >= 32 chars: env-validation.ts lo exige y el next start del job E2E
  # corre esa validacion en el instrumentation hook (si falla, el server no levanta).
  JWT_SECRET: test-jwt-secret-ci-only-min-32-chars-padding
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install

      - name: TypeScript check
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: npx tsc --noEmit

      - name: ESLint
        run: bun run lint

  unit-tests:
    name: Unit & Property Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: park_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --skip-generate

      - name: Run tests
        run: bun run test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        env:
          # next build pesa mas que tsc; sin esto el worker hace OOM (heap default ~2GB)
          NODE_OPTIONS: "--max_old_space_size=6144"
        run: bun run build

  e2e-smoke:
    name: E2E Smoke Gate
    runs-on: ubuntu-latest
    # Contencion: el smoke debe ser RAPIDO; si supera 12min algo se colgo.
    timeout-minutes: 12
    # MIDIENDO: arranca NO-BLOQUEANTE. Se endurece a bloqueante (quitar continue-on-error)
    # cuando el CI confirme que estos specs criticos pasan verde de forma estable.
    # Endurecer un gate sin confirmar verde primero lo auto-bloquea: primero el CI del PR
    # mide cuales del smoke realmente pasan, despues se quita esta linea.
    continue-on-error: true
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: park_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --skip-generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build for E2E
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"
        run: bun run build

      # MISMO seed que el job e2e-tests: sin tenant 11111111 / admin PIN 1111 los specs
      # autenticados (sale-flow, waiter-to-kds, payment, role-guards) no pueden loguear.
      # Idempotente (upsert) y usa el mismo PIN_SALT default que el runtime.
      - name: Seed E2E test tenants (tenant 11111111 / admin PIN 1111)
        run: npx tsx scripts/provision-e2e-test-tenants.ts

      - name: Run E2E smoke
        run: bun run test:e2e:smoke
        env:
          CI: true

      - name: Upload E2E smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Contencion: corta el job si se cuelga (antes corria hasta el timeout default de 6h).
    timeout-minutes: 25
    # NO-BLOQUEANTE: el suite E2E (Playwright) es lento (~20min) y aun tiene specs flaky.
    # Da senal util pero no debe gatear el merge; se estabiliza en su propio carril.
    # El gate duro de merge es Lint+TypeCheck + Build + Unit (rapido y determinista).
    continue-on-error: true
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: park_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --skip-generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build for E2E
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"
        run: bun run build

      # CAUSA RAIZ del fallo masivo del E2E: la DB de test nacia VACIA (prisma db push
      # crea el esquema, nadie sembraba datos) -> authenticateAsAdmin no podia loguear
      # (tenant 11111111 / admin PIN 1111 inexistentes) -> cientos de tests timeout 15min.
      # El provision es idempotente (upsert) y usa el mismo PIN_SALT default que el runtime.
      - name: Seed E2E test tenants (tenant 11111111 / admin PIN 1111)
        run: npx tsx scripts/provision-e2e-test-tenants.ts

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          CI: true

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Production deploys via Vercel GitHub integration (auto on push to main).
  # Staging deploys via Vercel preview (auto on PRs).
  # No manual deploy step needed — Vercel handles it.

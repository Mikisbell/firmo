name: GGA Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Necesario para que el step de comentar el PR no falle con 403.
permissions:
  contents: read
  pull-requests: write

jobs:
  validate-code:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full git history for PR mode

      # Si no hay API key configurada, omitimos el review en CI sin dar rojo falso:
      # el hook pre-commit local de GGA ya revisa cada commit. (gate-on-secret)
      - name: Check AI provider key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY no configurado; se omite el review GGA en CI (el hook pre-commit local ya lo aplica)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Instalacion SIN brew: clonar el repo y correr install.sh (instala en ~/.local/bin o ~/bin).
      - name: Install GGA (sin brew)
        if: steps.key.outputs.present == 'true'
        run: |
          git clone --depth 1 https://github.com/Gentleman-Programming/gentleman-guardian-angel.git /tmp/gga
          ( cd /tmp/gga && ./install.sh )
          # install.sh coloca el binario en ~/.local/bin (Linux) o ~/bin; cubrimos ambos.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Verify GGA
        if: steps.key.outputs.present == 'true'
        run: gga version

      - name: Run GGA Code Review
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Gentleman Guardian Angel - PR Code Review"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          gga run --pr-mode --ci

      - name: Upload violation report
        if: failure() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gga-violations
          path: |
            gga-report.txt
          retention-days: 30

      - name: Comment PR on failure
        if: failure() && steps.key.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **GGA Code Review Failed**\n\nRevisa las violaciones en los logs del workflow y corrigelas antes de mergear.'
            })

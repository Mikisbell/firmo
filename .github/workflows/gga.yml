name: GGA Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Necesario para que el step de comentar el PR no falle con 403.
permissions:
  contents: read
  pull-requests: write

jobs:
  validate-code:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full git history for PR mode

      # GGA usa PROVIDER="claude" -> invoca el CLI de Claude Code (`claude --print`).
      # Autenticamos con la SUSCRIPCION via CLAUDE_CODE_OAUTH_TOKEN (generado en local con
      # `claude setup-token`), NO con una API key de billing. Si el secret no esta, el
      # review se omite sin rojo falso (el hook pre-commit local de GGA ya revisa cada commit).
      - name: Check Claude Code token
        id: auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN no configurado; se omite el review GGA en CI (el hook pre-commit local ya lo aplica). Generalo con 'claude setup-token' y agregalo como secret."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.auth.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # CLI de Claude Code (lo que GGA invoca como provider 'claude').
      - name: Install Claude Code CLI
        if: steps.auth.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Instalacion de GGA SIN brew: clonar el repo oficial y correr install.sh.
      - name: Install GGA (sin brew)
        if: steps.auth.outputs.present == 'true'
        run: |
          git clone --depth 1 https://github.com/Gentleman-Programming/gentleman-guardian-angel.git /tmp/gga
          ( cd /tmp/gga && ./install.sh )
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Verify tooling
        if: steps.auth.outputs.present == 'true'
        run: |
          gga version
          claude --version || true

      - name: Run GGA Code Review
        if: steps.auth.outputs.present == 'true'
        env:
          # El CLI de Claude Code usa la suscripcion via este token (sin API billing).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Gentleman Guardian Angel - PR Code Review (provider: claude)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          gga run --pr-mode --ci

      - name: Upload violation report
        if: failure() && steps.auth.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gga-violations
          path: |
            gga-report.txt
          retention-days: 30

      - name: Comment PR on failure
        if: failure() && steps.auth.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **GGA Code Review Failed**\n\nRevisa las violaciones en los logs del workflow y corrigelas antes de mergear.'
            })
